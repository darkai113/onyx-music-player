<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onyx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b0a;
  --s1:#131211;
  --ink:#ece8e1;
  --dim:#8c867c;
  --faint:#3a3733;
  --line:#22201d;
  --ember:#ff6a2b;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* фон */
#wall{position:fixed;inset:0;z-index:0;background:center/cover no-repeat;display:none}
#wall.on{display:block}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,11,10,.55),rgba(12,11,10,.92))}

.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr auto}

/* левая колонка */
.rail{border-right:1px solid var(--line);background:rgba(12,11,10,.7);backdrop-filter:blur(10px);padding:28px 20px 20px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.5px;display:flex;align-items:baseline;gap:2px}
.brand i{width:7px;height:7px;background:var(--ember);border-radius:50%;display:inline-block;margin-left:2px}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border:1px solid var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;transition:background .15s,color .15s}
.upload:hover{background:var(--ink);color:var(--bg)}
nav{display:flex;flex-direction:column;gap:2px}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;display:flex;justify-content:space-between;align-items:center}
.sect:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;padding:8px 8px;margin:0 -8px;font-size:14px;color:var(--dim);text-align:left;border-radius:2px;transition:color .15s,background .15s}
.nav:hover{color:var(--ink)}
.nav.active{color:var(--ink);background:var(--s1)}
.nav.active .ic{color:var(--ember)}
.nav span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--faint)}
.mini{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim)}
.mini:hover{color:var(--ink)}
.mini .ic{width:14px;height:14px}

/* основная часть */
main{overflow:auto;padding:44px 52px 28px;position:relative}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kicker{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:56px;line-height:1;letter-spacing:-1px}
.meta{margin:12px 0 0;font-family:var(--mono);font-size:12px;color:var(--dim)}
.head-actions{display:flex;gap:10px;align-items:center}
.pill{height:34px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--ink)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.solid:hover{background:var(--ember);border-color:var(--ember)}
.pill.warn:hover{border-color:var(--ember);color:var(--ember)}

.drop{margin:22px 0 10px;border:1px dashed var(--faint);padding:18px 20px;display:flex;align-items:center;gap:14px;color:var(--dim);font-size:14px;cursor:pointer;transition:border-color .15s,color .15s}
.drop:hover,.drop.over{border-color:var(--ember);color:var(--ink)}
.drop u{text-decoration:none;color:var(--ink);border-bottom:1px solid var(--ember)}

/* список треков */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 96px;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:hover{background:var(--s1)}
.row.current .name{color:var(--ember)}
.row .n{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;display:flex;justify-content:center}
.row .name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .dur{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right}
.row .acts{display:flex;justify-content:flex-end;gap:2px;opacity:0;transition:opacity .15s}
.row:hover .acts,.row.current .acts{opacity:1}
.row .acts button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);border-radius:2px}
.row .acts button:hover{color:var(--ink);background:var(--line)}
.row .acts button.del:hover{color:var(--ember)}

/* эквалайзер для играющего трека */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:2px;background:var(--ember);height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

.empty{padding:70px 0;color:var(--dim);font-size:15px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:420px}
.empty .ring{width:44px;height:44px;border:1px solid var(--faint);border-radius:50%;position:relative}
.empty .ring::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--ember)}

/* нижняя панель */
.bar{position:relative;z-index:2;grid-column:1 / -1;background:rgba(12,11,10,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:0 24px;height:82px}
#seek{position:absolute;top:-3px;left:0;right:0;width:100%;height:6px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ember) var(--p,0%),var(--faint) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;background:var(--ink);border-radius:50%;opacity:0;transition:opacity .15s}
#seek:hover::-webkit-slider-thumb{opacity:1}
#seek::-moz-range-track{height:2px;background:var(--faint)}
#seek::-moz-range-progress{height:2px;background:var(--ember)}
#seek::-moz-range-thumb{width:10px;height:10px;background:var(--ink);border:0;border-radius:50%;opacity:0}
#seek:hover::-moz-range-thumb{opacity:1}

.now{display:flex;align-items:center;gap:14px;min-width:0}
.art{width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;flex-shrink:0;background:var(--s1)}
.art.on{border-color:var(--ember)}
.txt{min-width:0}
#nowTitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowSub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.02em}

.transport{display:flex;align-items:center;gap:6px}
.tbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);position:relative;transition:color .15s}
.tbtn:hover{color:var(--ink)}
.tbtn.on{color:var(--ember)}
.tbtn.on::after{content:"";position:absolute;bottom:-2px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--ember)}
.tbtn.big{width:48px;height:48px;border:1px solid var(--ink);border-radius:50%;color:var(--ink);margin:0 6px}
.tbtn.big:hover{background:var(--ink);color:var(--bg)}
.tbtn.big .ic{width:18px;height:18px;stroke-width:1.4}
.tbtn .ic{width:18px;height:18px}

.side{display:flex;align-items:center;gap:18px;justify-content:flex-end;min-width:0}
.time{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.time b{font-weight:400;color:var(--ink)}
.vol{display:flex;align-items:center;gap:10px;color:var(--dim)}
.vol input{width:92px;height:2px;-webkit-appearance:none;appearance:none;background:var(--faint);outline:none;cursor:pointer}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;background:var(--ink);border-radius:50%}
.vol input::-moz-range-thumb{width:9px;height:9px;background:var(--ink);border:0;border-radius:50%}

/* модалки и тосты */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--line);width:min(360px,100%);padding:26px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.15}
.modal input[type=text]{background:transparent;border:0;border-bottom:1px solid var(--ink);padding:8px 0;font-size:17px;outline:none;border-radius:0}
.modal .choice{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);color:var(--dim);font-size:15px}
.modal .choice:hover{color:var(--ink)}
.modal .choice b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--faint)}
.modal .rowb{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.modal .rowb button{height:34px;padding:0 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);color:var(--dim)}
.modal .rowb button:hover{color:var(--ink);border-color:var(--ink)}
.modal .rowb button.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modal .rowb button.ok:hover{background:var(--ember);border-color:var(--ember)}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:10px 16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line);gap:12px}
  .rail nav{flex-direction:row;overflow-x:auto;gap:4px;width:100%}
  .rail .sect,.rail .nav span,.rail .nav b{display:none}
  .rail .nav{margin:0;padding:6px 10px;border:1px solid var(--line)}
  .rail #plNav{display:flex;gap:4px;overflow-x:auto}
  .rail #plNav .nav{white-space:nowrap}
  .rail #plNav .nav span{display:inline}
  .rail .upload{width:auto;padding:0 12px}
  .brand{font-size:26px}
  main{padding:26px 18px 20px}
  h1{font-size:40px}
  .row{grid-template-columns:32px minmax(0,1fr) 56px;padding:12px 2px}
  .row .acts{opacity:1}
  .bar{grid-template-columns:1fr;gap:8px;height:auto;padding:12px 16px 14px}
  .side{display:none}
  .transport{justify-content:center}
}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => { if(!isFinite(t)) return '0:00'; t = Math.floor(t); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const icon = (id, cls = 'ic') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

/* ---------- состояние ---------- */
const KEY = 'onyx-state-v2';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || {
  tracks: [], playlists: [], wallpaper: false, repeat: 'off', shuffle: false, volume: 0.8
};
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
const trackById = id => state.tracks.find(t => t.id === id);
const currentPl = () => state.playlists.find(p => p.id === view.id);

/* ---------- файлы в IndexedDB ---------- */
const dbP = new Promise((res, rej) => {
  const r = indexedDB.open('onyx', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('files');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function dbOp(mode, fn){
  const db = await dbP;
  return new Promise((res, rej) => {
    const tx = db.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const putFile = (k, blob) => dbOp('readwrite', s => s.put(blob, k));
const getFile = k => dbOp('readonly', s => s.get(k));
const delFile = k => dbOp('readwrite', s => s.delete(k));

const urlCache = new Map();
async function trackUrl(id){
  if(urlCache.has(id)) return urlCache.get(id);
  const blob = await getFile(id);
  if(!blob) return null;
  const u = URL.createObjectURL(blob);
  urlCache.set(id, u);
  return u;
}
function dropUrl(id){
  if(urlCache.has(id)){ URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
}

let wallUrl = null;
async function applyWallpaper(){
  const w = $('#wall');
  if(!state.wallpaper){ w.classList.remove('on'); return; }
  const blob = await getFile('wallpaper');
  if(!blob){ state.wallpaper = false; save(); w.classList.remove('on'); return; }
  if(wallUrl) URL.revokeObjectURL(wallUrl);
  wallUrl = URL.createObjectURL(blob);
  w.style.backgroundImage = `url("${wallUrl}")`;
  w.classList.add('on');
}

/* ---------- плеер ---------- */
const audio = $('#audio');
let view = { type:'library', id:null };
let queue = [];
let qIndex = -1;
let curId = null;
let seeking = false;

function viewTracks(){
  if(view.type === 'library') return state.tracks.map(t => t.id);
  const p = currentPl();
  return p ? p.trackIds.filter(id => trackById(id)) : [];
}

function playFrom(ids, id){
  queue = ids.slice();
  qIndex = queue.indexOf(id);
  if(qIndex < 0) return;
  loadAndPlay();
}

async function loadAndPlay(){
  const id = queue[qIndex];
  const url = await trackUrl(id);
  if(!url){ toast('Файл не найден'); return; }
  curId = id;
  audio.src = url;
  audio.volume = state.volume;
  try { await audio.play(); } catch(e) {}
  render();
}

function nextIndex(){
  if(!queue.length) return -1;
  if(state.shuffle && queue.length > 1){
    let r; do { r = Math.floor(Math.random() * queue.length); } while(r === qIndex);
    return r;
  }
  if(qIndex + 1 < queue.length) return qIndex + 1;
  return state.repeat === 'all' ? 0 : -1;
}

function next(){
  const n = nextIndex();
  if(n < 0){ audio.pause(); audio.currentTime = 0; render(); return; }
  qIndex = n;
  loadAndPlay();
}

function prev(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  if(!queue.length) return;
  qIndex = qIndex > 0 ? qIndex - 1 : (state.repeat === 'all' ? queue.length - 1 : 0);
  loadAndPlay();
}

function togglePlay(){
  if(!curId){
    const ids = viewTracks();
    if(ids.length) playFrom(ids, ids[0]);
    return;
  }
  audio.paused ? audio.play() : audio.pause();
}

function stopPlayback(){
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  curId = null; queue = []; qIndex = -1;
}

audio.addEventListener('ended', () => {
  if(state.repeat === 'one'){ audio.currentTime = 0; audio.play(); return; }
  next();
});
audio.addEventListener('play', render);
audio.addEventListener('pause', render);
audio.addEventListener('loadedmetadata', () => { $('#dur').textContent = fmt(audio.duration); });
audio.addEventListener('error', () => { if(curId) toast('Не удалось проиграть трек'); });
audio.addEventListener('timeupdate', () => {
  const d = audio.duration;
  $('#cur').textContent = fmt(audio.currentTime);
  if(d && !seeking){
    const p = audio.currentTime / d * 1000;
    $('#seek').value = p;
    $('#seek').style.setProperty('--p', (p / 10) + '%');
  }
});

const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  seeking = true;
  seekEl.style.setProperty('--p', (seekEl.value / 10) + '%');
});
seekEl.addEventListener('change', () => {
  if(audio.duration) audio.currentTime = seekEl.value / 1000 * audio.duration;
  seeking = false;
});

$('#volume').value = state.volume;
$('#volume').style.background = `linear-gradient(to right, var(--ink) ${state.volume*100}%, var(--faint) ${state.volume*100}%)`;
$('#volume').addEventListener('input', e => {
  state.volume = +e.target.value;
  audio.volume = state.volume;
  e.target.style.background = `linear-gradient(to right, var(--ink) ${state.volume*100}%, var(--faint) ${state.volume*100}%)`;
  save();
});

$('#play').onclick = togglePlay;
$('#next').onclick = next;
$('#prev').onclick = prev;
$('#repeat').onclick = () => {
  state.repeat = { off:'all', all:'one', one:'off' }[state.repeat];
  save(); paintModes();
};
$('#shuffle').onclick = () => {
  state.shuffle = !state.shuffle;
  save(); paintModes();
};

function paintModes(){
  $('#repeatIcon').setAttribute('href', state.repeat === 'one' ? '#i-repeat1' : '#i-repeat');
  $('#repeat').classList.toggle('on', state.repeat !== 'off');
  $('#repeat').title = { off:'Повтор выключен', all:'Повтор всех треков', one:'Повтор одного трека' }[state.repeat];
  $('#shuffle').classList.toggle('on', state.shuffle);
}

function updateNow(){
  const t = trackById(curId);
  const playing = t && !audio.paused;
  $('#nowTitle').textContent = t ? t.name : 'Ничего не играет';
  $('#nowSub').textContent = t ? (audio.paused ? 'пауза' : 'сейчас играет') : 'onyx';
  $('#art').textContent = t ? t.name.trim().charAt(0).toUpperCase() : '·';
  $('#art').classList.toggle('on', !!playing);
  $('#playIcon').setAttribute('href', playing ? '#i-pause' : '#i-play');
  if(!t){ $('#cur').textContent = '0:00'; $('#dur').textContent = '0:00'; seekEl.value = 0; seekEl.style.setProperty('--p','0%'); }
}

if('mediaSession' in navigator){
  try {
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  } catch(e) {}
}

/* ---------- треки ---------- */
function probeDuration(blob){
  return new Promise(res => {
    const a = new Audio();
    const u = URL.createObjectURL(blob);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { res(a.duration); URL.revokeObjectURL(u); };
    a.onerror = () => { res(0); URL.revokeObjectURL(u); };
    a.src = u;
  });
}

async function addFiles(files){
  const list = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus|webm)$/i.test(f.name));
  if(!list.length){ toast('Это не аудиофайлы'); return; }
  for(const f of list){
    const id = uid();
    await putFile(id, f);
    const duration = await probeDuration(f);
    state.tracks.push({ id, name: f.name.replace(/\.[^.]+$/, ''), duration, added: Date.now() });
  }
  save(); render();
  toast(`Добавлено: ${list.length}`);
}

async function removeTrack(id){
  if(id === curId) stopPlayback();
  state.tracks = state.tracks.filter(t => t.id !== id);
  state.playlists.forEach(p => p.trackIds = p.trackIds.filter(x => x !== id));
  dropUrl(id);
  await delFile(id);
  save(); render();
}

/* ---------- плейлисты ---------- */
async function addToPlaylist(trackId){
  if(!state.playlists.length){ toast('Сначала создайте плейлист'); return; }
  const pick = await choose('В плейлист',
    state.playlists.map(p => ({ value: p.id, label: p.name, count: p.trackIds.length })));
  if(!pick) return;
  const p = state.playlists.find(x => x.id === pick);
  if(p.trackIds.includes(trackId)){ toast('Уже в этом плейлисте'); return; }
  p.trackIds.push(trackId);
  save(); render();
  toast(`Добавлено в ${p.name}`);
}

function removeFromPlaylist(trackId){
  const p = currentPl(); if(!p) return;
  p.trackIds = p.trackIds.filter(x => x !== trackId);
  save(); render();
}

async function renamePl(){
  const p = currentPl(); if(!p) return;
  const n = await ask('Переименовать', p.name);
  if(n){ p.name = n; save(); render(); }
}

async function delPl(){
  const p = currentPl(); if(!p) return;
  if(await confirmBox(`Удалить плейлист «${p.name}»? Треки останутся в библиотеке.`)){
    state.playlists = state.playlists.filter(x => x !== p);
    view = { type:'library', id:null };
    save(); render();
  }
}

$('#newPl').onclick = async () => {
  const name = await ask('Новый плейлист', 'Без названия');
  if(!name) return;
  const p = { id: uid(), name, trackIds: [] };
  state.playlists.push(p);
  view = { type:'playlist', id: p.id };
  save(); render();
};

/* ---------- отрисовка ---------- */
function renderNav(){
  $('#libCount').textContent = state.tracks.length;
  document.querySelectorAll('[data-view="library"]').forEach(b =>
    b.classList.toggle('active', view.type === 'library'));
  $('#plNav').innerHTML = state.playlists.map(p => `
    <button class="nav ${view.type === 'playlist' && view.id === p.id ? 'active' : ''}" data-pl="${p.id}">
      ${icon('i-list')}<span>${esc(p.name)}</span><b>${p.trackIds.length}</b>
    </button>`).join('') || '<div style="font-size:13px;color:var(--faint);padding:4px 0">Пока пусто</div>';
}

function renderMain(){
  const isLib = view.type === 'library';
  const pl = isLib ? null : currentPl();
  if(!isLib && !pl){ view = { type:'library', id:null }; return render(); }

  const ids = viewTracks();
  const total = ids.reduce((s, id) => s + (trackById(id)?.duration || 0), 0);
  $('#kicker').textContent = isLib ? 'Библиотека' : 'Плейлист';
  $('#title').textContent = isLib ? 'Все треки' : pl.name;
  $('#meta').textContent = `${ids.length} трек(ов) · ${Math.round(total / 60)} мин`;

  $('#headActions').innerHTML = `
    <button class="pill solid" id="playAll">${icon('i-play')}Играть</button>
    ${isLib ? '' : `<button class="pill" id="renamePl">${icon('i-edit')}Переименовать</button>
                    <button class="pill warn" id="delPl">${icon('i-trash')}Удалить</button>`}`;

  const list = $('#list');
  if(!ids.length){
    list.innerHTML = `<div class="empty"><span class="ring"></span>${isLib
      ? 'Пока тихо. Загрузите свою музыку кнопкой «Загрузить» или перетащите файлы в окно.'
      : 'В плейлисте пока ничего нет. Добавляйте треки кнопкой «+» в библиотеке.'}</div>`;
    return;
  }
  list.innerHTML = ids.map((id, i) => {
    const t = trackById(id);
    const isCur = id === curId;
    const idx = isCur && !audio.paused
      ? `<span class="eq"><i></i><i></i><i></i></span>`
      : (i + 1).toString().padStart(2, '0');
    return `
      <div class="row ${isCur ? 'current' : ''}" data-id="${id}">
        <div class="n">${idx}</div>
        <div class="name">${esc(t.name)}</div>
        <div class="dur">${fmt(t.duration)}</div>
        <div class="acts">
          <button data-act="add" title="В плейлист">${icon('i-plus')}</button>
          ${isLib ? '' : `<button data-act="out" title="Убрать из плейлиста">${icon('i-minus')}</button>`}
          <button class="del" data-act="del" title="Удалить">${icon('i-trash')}</button>
        </div>
      </div>`;
  }).join('');
}

function render(){
  renderNav();
  renderMain();
  updateNow();
  paintModes();
}

/* ---------- события ---------- */
document.querySelector('[data-view="library"]').onclick = () => { view = { type:'library', id:null }; render(); };
$('#plNav').addEventListener('click', e => {
  const b = e.target.closest('[data-pl]'); if(!b) return;
  view = { type:'playlist', id: b.dataset.pl }; render();
});

$('#list').addEventListener('click', async e => {
  const row = e.target.closest('.row'); if(!row) return;
  const id = row.dataset.id;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(!act){ playFrom(viewTracks(), id); return; }
  if(act === 'add') return addToPlaylist(id);
  if(act === 'out') return removeFromPlaylist(id);
  if(act === 'del'){
    const t = trackById(id);
    if(await confirmBox(`Удалить «${t.name}» из onyx?`)) removeTrack(id);
  }
});

$('#headActions').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'playAll'){
    const ids = viewTracks();
    if(!ids.length) return;
    const start = state.shuffle ? ids[Math.floor(Math.random() * ids.length)] : ids[0];
    playFrom(ids, start);
  }
  if(b.id === 'renamePl') renamePl();
  if(b.id === 'delPl') delPl();
});

$('#addBtn').onclick = () => $('#audioInput').click();
$('#drop').onclick = () => $('#audioInput').click();
$('#audioInput').onchange = e => {
  const files = [...e.target.files];
  e.target.value = '';
  addFiles(files);
};

document.addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
document.addEventListener('dragleave', e => { if(!e.relatedTarget) $('#drop').classList.remove('over'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  $('#drop').classList.remove('over');
  if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

$('#wallBtn').onclick = () => $('#wallInput').click();
$('#wallInput').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('Нужна картинка'); return; }
  await putFile('wallpaper', f);
  state.wallpaper = true; save();
  applyWallpaper();
  toast('Фон установлен');
};
$('#wallReset').onclick = async () => {
  if(!state.wallpaper) return;
  await delFile('wallpaper');
  state.wallpaper = false; save();
  applyWallpaper();
};

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if(e.code === 'Space' && !modal.classList.contains('open')){
    e.preventDefault();
    if(e.target.tagName === 'BUTTON') e.target.blur();
    togglePlay();
  }
  if(e.key === 'Escape') finish(null);
});

/* ---------- модалки ---------- */
const modal = $('#modal'), box = $('#modalBox');
let resolveModal = null;
function openModal(html){ box.innerHTML = html; modal.classList.add('open'); }
function finish(v){
  const r = resolveModal; resolveModal = null;
  modal.classList.remove('open'); box.innerHTML = '';
  if(r) r(v);
}
modal.addEventListener('click', e => { if(e.target === modal) finish(null); });

function ask(title, value = ''){
  return new Promise(res => {
    resolveModal = res;
    openModal(`<h3>${esc(title)}</h3>
      <input type="text" id="mIn" value="${esc(value)}" maxlength="60">
      <div class="rowb"><button data-m="0">Отмена</button><button class="ok" data-m="1">Ок</button></div>`);
    const inp = $('#mIn');
    inp.focus(); inp.select();
    inp.onkeydown = e => {
      if(e.key === 'Enter') finish(inp.value.trim() || null);
      if(e.key === 'Escape') finish(null);
    };
    box.querySelector('[data-m="1"]').onclick = () => finish(inp.value.trim() || null);
    box.querySelector('[data-m="0"]').onclick = () => finish(null);
  });
}

function choose(title, items){
  return new Promise(res => {
    resolveModal = res;
    openModal(`<h3>${esc(title)}</h3>` +
      items.map((it, i) => `<button class="choice" data-i="${i}"><span>${esc(it.label)}</span><b>${it.count}</b></button>`).join('') +
      `<div class="rowb"><button data-m="0">Отмена</button></div>`);
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => finish(items[+b.dataset.i].value));
    box.querySelector('[data-m="0"]').onclick = () => finish(null);
  });
}

function confirmBox(text){
  return new Promise(res => {
    resolveModal = v => res(!!v);
    openModal(`<h3>${esc(text)}</h3>
      <div class="rowb"><button data-m="0">Отмена</button><button class="ok" data-m="1">Удалить</button></div>`);
    box.querySelector('[data-m="0"]').onclick = () => finish(false);
    box.querySelector('[data-m="1"]').onclick = () => finish(true);
  });
}

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- старт ---------- */
audio.volume = state.volume;
applyWallpaper();
render();
</script>
</body>
</html>
